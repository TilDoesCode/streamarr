plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.offlinedownloads'
version = '0.1.0'

android {
  namespace "expo.modules.offlinedownloads"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // JVM unit tests (src/test): ./gradlew :offline-downloads:testDebugUnitTest
  testImplementation 'junit:junit:4.13.2'
}
