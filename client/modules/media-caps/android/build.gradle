plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mediacaps'
version = '0.1.0'

android {
  namespace "expo.modules.mediacaps"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Same Media3 as expo-video: the passthrough verdict is ExoPlayer's own AudioCapabilities.
  implementation "androidx.media3:media3-exoplayer:1.9.0"
}
