plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.embeddedserver'
version = '0.1.0'

android {
  namespace "expo.modules.embeddedserver"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Admin credentials of the embedded server live in EncryptedSharedPreferences (Android Keystore master key).
  implementation 'androidx.security:security-crypto:1.1.0'
}
