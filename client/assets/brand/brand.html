<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Outfit; font-weight: 700; src: url(../fonts/Outfit-Bold.ttf); }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  .aurora {
    position: absolute; inset: 0; background: #0a0c12;
    background-image:
      radial-gradient(60% 55% at 18% 16%, rgba(63, 207, 170, 0.55), transparent 70%),
      radial-gradient(55% 60% at 85% 88%, rgba(110, 120, 240, 0.55), transparent 72%),
      radial-gradient(70% 60% at 70% 20%, rgba(40, 110, 200, 0.45), transparent 70%),
      radial-gradient(50% 45% at 25% 85%, rgba(20, 80, 90, 0.6), transparent 70%);
  }
  .mark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .row { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 2vh; }
  .word { font-family: Outfit; font-weight: 700; color: #fff; letter-spacing: -0.025em; line-height: 1; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FF3DA" />
      <stop offset="0.55" stop-color="#6FB4FF" />
      <stop offset="1" stop-color="#9A9CFF" />
    </linearGradient>
    <symbol id="tri" viewBox="0 0 100 100">
      <path d="M30 18.5 C30 13.2 35.8 9.9 40.4 12.6 L84.2 38.4 C88.7 41.1 88.7 47.7 84.2 50.4 L40.4 76.2 C35.8 78.9 30 75.6 30 70.3 Z"
            transform="translate(-6 5.6)" />
    </symbol>
  </defs>
</svg>
<script>
  const asset = new URLSearchParams(location.search).get('asset');
  const vw = innerWidth, vh = innerHeight, min = Math.min(vw, vh);
  const tri = (size, fill) =>
    `<svg class="mark" width="${size}" height="${size}" viewBox="0 0 100 100"><use href="#tri" fill="${fill}" /></svg>`;
  const inline = (size) =>
    `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><use href="#tri" fill="url(#play)" /></svg>`;
  let html = '';
  if (asset === 'icon' || asset === 'favicon' || asset === 'adaptive-bg') {
    html = `<div class="aurora"></div>` + (asset === 'adaptive-bg' ? '' : tri(min * 0.62, 'url(#play)'));
  } else if (asset === 'adaptive-fg') {
    html = tri(min * 0.42, 'url(#play)');
  } else if (asset === 'mono') {
    html = tri(min * 0.42, '#ffffff');
  } else if (asset === 'splash') {
    html = tri(min * 0.9, 'url(#play)');
  } else if (asset === 'banner' || asset === 'tv-icon' || asset === 'topshelf') {
    const h = Math.min(vh * (asset === 'topshelf' ? 0.2 : 0.26), vw * 0.12);
    html = `<div class="aurora"></div><div class="row">${inline(h * 1.5)}<span class="word" style="font-size:${h}px">streamarr</span></div>`;
  }
  document.body.innerHTML += html;
</script>
</body>
</html>
